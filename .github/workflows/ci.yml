name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test domain and database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mocktest-domain -p mocktest-db

  build:
    name: Build worker and app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129,trunk
      - name: Build worker
        run: scripts/build-worker.sh
      - name: Build app
        working-directory: crates/web
        run: trunk build --release
