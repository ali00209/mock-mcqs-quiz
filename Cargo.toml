[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/db",
    "crates/worker",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["MockTest contributors"]
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
thiserror = "2.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
sqlite-wasm-rs = "0.6.2"
sqlite-wasm-vfs = "0.3.0"
base64 = "0.22"
leptos = "0.8.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
